name: Linux and Proton builds
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup show
      - name: Portable regression tests
        run: cargo test --locked -p victory-core -p victory-formats -p victory-pipeline -p victory-shader -p victory-gpu --lib
      - name: Launcher and report tests
        run: |
          python3 -I linux/launcher/valhalla.py --selftest
          python3 -I linux/hw-log.py --selftest
          python3 -I linux/benchmark.py selftest
          bash linux/test-runtime-paths.sh
      - name: Asset policy
        run: cargo xtask policy

  proton-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          rustup show
          cargo install cargo-xwin --version 0.24.2 --locked
      - name: Build release and diagnostics
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: |
          cargo xwin build --locked --release -p victory --target x86_64-pc-windows-msvc
          cargo xwin build --locked --profile diag -p victory --features diagnostics --target x86_64-pc-windows-msvc
          mkdir -p artifacts
          cp target/x86_64-pc-windows-msvc/release/valhalla.exe artifacts/valhalla.exe
          cp target/x86_64-pc-windows-msvc/diag/valhalla.exe artifacts/valhalla-diagnostics.exe
          cd artifacts
          sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: valhalla-proton-x64
          path: artifacts/
          if-no-files-found: error
